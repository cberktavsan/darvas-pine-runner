# Example vhost for the runner. Serve the built `dist/` as static files on its own origin.
# The CSP header repeats the meta tag in index.html. The worker is created from a blob URL and
# inherits the page's policy, so the meta tag alone already covers it on hosts without headers.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pine.example.com;

    root /var/www/pine-runner/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' blob:; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=300" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
