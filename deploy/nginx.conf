# Example vhost for the runner. Serve the built `dist/` as static files on its own origin.
# The CSP header repeats the meta tag so it also covers the worker script.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pine.darvas.app;

    root /opt/darvas-pine-runner/dist;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self' blob:; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=300" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
